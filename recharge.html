<!DOCTYPE html>
<html>
<head>
    <title>Deposit - Samrat Savings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f8fafc; text-align: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        .upi-id { background: #e0f2fe; padding: 10px; border-radius: 10px; color: #0369a1; font-weight: bold; margin: 15px 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-send { background: #1e3a8a; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Paisa Jama Karein 💰</h2>
        <p style="font-size: 13px; color: #64748b;">Niche di gayi UPI ID par payment karein aur UTR number yahan bharein.</p>
        
        <div class="upi-id">UPI ID: gaurav@upi</div> <!-- Yahan apni UPI ID badal lo -->

        <input type="number" id="amt" placeholder="Amount (₹)">
        <input type="text" id="utr" placeholder="UTR / Transaction ID">
        
        <button class="btn-send" onclick="submitDeposit()">SUBMIT DEPOSIT</button>
        <br><br>
        <a href="dashboard.html" style="color: #64748b; text-decoration: none; font-size: 14px;">← Wapas Dashboard</a>
    </div>

<script>
    const SUPABASE_URL = "https://ugqcxyjrtjzgrsjnsdzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Vh_h43bueeQGhN_vXeey6w_V0rnZ"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function submitDeposit() {
        const userId = localStorage.getItem("xtreme_user_id");
        const amount = document.getElementById("amt").value;
        const utr = document.getElementById("utr").value;

        if(!amount || !utr) return alert("Pehle poori jankari bhariye!");

        // Supabase mein 'deposits_xtreme' naam ki table mein request jayegi
        const { error } = await _supabase.from('bets_xtreme').insert([
            { user_id: userId, amount: amount, number: utr, status: 'pending' }
        ]);

        if(!error) {
            alert("Request Bhej di gayi hai! Admin 10 min mein check karke balance badha dega.");
            window.location.href = "dashboard.html";
        } else {
            alert("Error: " + error.message);
        }
    }
</script>
</body>
</html>
