<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Samrat Daily Savings</title>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1e3a8a; --gold: #fbbf24; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; border-top: 5px solid var(--primary); }
        h2 { color: var(--primary); margin-bottom: 25px; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; border-box: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn-login { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 15px; }
        .btn-login:hover { background: #1e40af; }
        .footer-link { margin-top: 20px; font-size: 14px; color: #64748b; }
    </style>
</head>
<body>

<div class="card">
    <h2>MEMBER LOGIN</h2>
    <input type="text" id="loginPhone" placeholder="Mobile Number">
    <input type="password" id="loginPass" placeholder="Access PIN / Password">
    
    <button class="btn-login" onclick="handleLogin()">LOGIN NOW</button>
    
    <div class="footer-link">
        Naya khata kholna hai? <a href="signup.html" style="color: var(--primary); font-weight: bold;">Register Karein</a>
    </div>
</div>

<script>
    // --- APKI ASLI SUPABASE CONFIG ---
    const SUPABASE_URL = "https://ugqcxyjrtjzgrsjnsdzz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Vh_h43bueeQGhN_vXeey6w_V0rnZ"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleLogin() {
        const phone = document.getElementById("loginPhone").value.trim();
        const pass = document.getElementById("loginPass").value.trim();

        if(!phone || !pass) {
            alert("Bhai details dalo!");
            return;
        }

        try {
            // Supabase se user check karna
            const { data, error } = await _supabase
                .from('users_xtreme')
                .select('*')
                .eq('phone', phone)
                .eq('password', pass)
                .single();

            if (error || !data) {
                alert("Galat details! Pehle register karein.");
            } else {
                // Login ki info mobile mein save karna
                localStorage.setItem("xtreme_user_id", data.id);
                localStorage.setItem("xtreme_user_name", data.name);
                
                alert("Namaste, " + data.name + "! Login Successful.");
                window.location.href = "dashboard.html"; // Dashboard par bhejo
            }
        } catch (err) {
            alert("Connection Error: " + err.message);
        }
    }
</script>
</body>
</html>
